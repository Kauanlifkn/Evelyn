# Hidro Alerta — infraestrutura local (RECOVERY-3)
#
# Uso:
#   docker compose up -d          # sobe postgres+redis
#   docker compose ps             # ambos devem ficar "healthy"
#   docker compose down           # para (mantém volumes)
#
# Portas no host:
#   - PostgreSQL: 5434  (5432 e 5433 já estavam ocupadas nesta máquina —
#     documentado em docs/DATABASE.md; o container interno continua 5432)
#   - Redis: 6379 (livre; fallback documentado: 6380 via REDIS_PORT)
#
# Credenciais: lidas do .env (veja .env.example). NUNCA commitar senha real.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hidro-alerta-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hidro_alerta}
      POSTGRES_USER: ${POSTGRES_USER:-hidro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hidro_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - hidro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hidro} -d ${POSTGRES_DB:-hidro_alerta}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: hidro-alerta-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - hidro-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  hidro-pgdata:
  hidro-redisdata:
